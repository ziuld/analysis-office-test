name: Build and healthy startup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore pinned sources and apply frontend patch
        shell: pwsh
        run: ./scripts/restore-sources.ps1
      - name: Build images and check isolated startup (no model credentials)
        shell: pwsh
        run: ./scripts/check-startup.ps1
