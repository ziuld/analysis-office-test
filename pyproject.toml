[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arktic-office-backend"
version = "0.2.0"
description = "Local Arktic Office API, evidence and report workflow"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
arktic-audit = "arktic_office.cli:main"
arktic-api = "arktic_office.api.server:main"
arktic-preview = "arktic_office.preview:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["arktic_office*"]

[tool.setuptools.package-data]
"arktic_office.resources" = ["assets/*", "profiles/*"]

[tool.setuptools.data-files]
"share/arktic-office/docs" = ["docs/ESTANDAR_COMUNICACION_INFORMES.md"]
