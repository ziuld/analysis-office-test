name: arktic-backend-regression
services:
  backend-tests:
    image: arktic-backend-tests:0.2.0
    build:
      context: .
      dockerfile: docker/Auditor.Dockerfile
      target: tests
      args:
        APP_VERSION: "0.2.0"
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
