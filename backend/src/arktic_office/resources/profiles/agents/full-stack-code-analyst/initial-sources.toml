# Los límites se aplican al conjunto de fuentes iniciales de Iris.
max_files = 8
max_bytes = 7200
max_file_bytes = 1100

[[groups]]
id = "purpose"
take = 1
patterns = [
    "README*",
    "docs/README*",
]

[[groups]]
id = "manifests"
take = 2
patterns = [
    "package.json",
    "pom.xml",
    "build.gradle*",
    "pyproject.toml",
    "requirements*.txt",
    "go.mod",
    "*.csproj",
    "apps/*/package.json",
]

[[groups]]
id = "entry"
take = 1
patterns = [
    "**/app/layout.[jt]sx",
    "**/*Application.java",
    "**/main.py",
    "**/server.[jt]s",
    "**/Program.cs",
    "**/main.go",
]

[[groups]]
id = "data"
take = 1
patterns = [
    "**/schema.prisma",
    "**/schema.sql",
    "**/models.py",
    "**/*DbContext.cs",
]

[[groups]]
id = "operation"
take = 2
patterns = [
    "turbo.json",
    "docker-compose.y*ml",
    "compose.y*ml",
    "Dockerfile",
    ".github/workflows/*.y*ml",
]

[[groups]]
id = "security"
take = 1
patterns = [
    "**/src/auth.[jt]s",
    "**/auth.py",
    "**/*SecurityConfig.java",
    "**/middleware.[jt]s",
]
