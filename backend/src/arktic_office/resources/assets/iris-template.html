.proposal-lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.proposal-lane{border:1px dashed #008ad8;padding:14px;border-radius:5px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.risk-detail{border-left:3px solid #dce5ec;padding-left:16px;margin-top:12px}
[id]{scroll-margin-top:115px}.hero h1{overflow-wrap:anywhere}.tag{white-space:normal}.flow>.arrow{display:block!important;text-align:center}.arrow small{display:block;font-size:9px}
@media(max-width:800px){.review-grid{grid-template-columns:1fr}#hallazgos-resumen table{min-width:720px;table-layout:auto}#hallazgos-resumen th{width:auto!important}}
.original-response{margin:0 1rem 1rem;padding:1rem;max-height:32rem;overflow:auto;border:1px solid var(--line);border-radius:5px;background:var(--bg);line-height:1.55}
.original-response:focus-visible{outline:3px solid #009da1;outline-offset:2px}.original-response code{font:inherit;font-family:Consolas,monospace}
@media print{
 .original-response{max-height:none;overflow:visible}
 @page{margin:15mm}body{background:white;color:#172d40;font-size:11px}.wrap{max-width:none;padding:0}.nav,.return-link,.hero-art{display:none!important}
 .hero{padding:15px;background:#fff;color:#172d40}.hero p,.meta span{color:#172d40}.hero:after{display:none}.chapter{break-before:auto}
 .panel,.review-card,.risk-detail{box-shadow:none;break-inside:avoid}.table-wrap{overflow:visible}table{min-width:0!important;table-layout:auto!important}
 th{display:table-cell}thead{display:table-header-group}tr{break-inside:avoid}details{content-visibility:visible}details>*{display:block!important}details>summary{display:block}
 pre{font-size:9px;white-space:pre-wrap}.review-grid{grid-template-columns:repeat(3,minmax(0,1fr))}a{color:inherit}
}

.reading-report .hero{padding:28px 0}.reading-report .hero h1{font-size:42px}
.reading-report .chapter{margin:36px 0 52px}.reading-report .chapter-heading{margin-bottom:26px}
.reading-report .reading-panel{padding:28px 32px;margin:18px 0}.reading-report p{line-height:1.8;max-width:86ch}
.reading-report .reading-panel h3,.reading-report .reading-limits h3{font-size:24px;margin:6px 0 16px}
.reading-report .reading-risk{margin:18px 0;padding:26px 30px;border-left:4px solid #b44416;color:var(--ink);background:#fff}
.reading-report .reading-risk h4{font-size:21px;line-height:1.4;margin:14px 0}.reading-report .risk-meta{display:flex;gap:8px;flex-wrap:wrap}
.reading-report .reading-limits{border-left:3px solid #41c0cf;padding:20px 26px;margin-top:28px;background:#eaf3f7}
.reading-report .reading-answer{padding:26px 0;border-bottom:1px solid var(--line)}.reading-report .reading-answer:last-child{border-bottom:0}
.reading-report .reading-answer h4{font-size:20px;line-height:1.5;margin:5px 0 14px}.reading-report .question-id{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.reading-report .response-note{font-size:13px;line-height:1.75;background:#f2f6f9;color:#526779;border-left:2px solid #bed4df;padding:12px 16px;margin:16px 0}
.reading-report .reading-answer details,.reading-report .reading-panel details,.reading-report .reading-risk details{box-shadow:none;margin:16px 0 0;border:0;border-top:1px solid var(--line);background:transparent}
.reading-report .reading-answer summary,.reading-report .reading-panel summary,.reading-report .reading-risk summary{padding:13px 0;font-size:12px}
.reading-report .source{overflow-wrap:anywhere}.reading-report .nav b{margin-right:7px}
.reading-report .severity-dot{display:inline-block;flex:none;width:13px;height:13px;border-radius:50%;border:1px solid #0002;vertical-align:middle}
.reading-report .severity-critica{background:#b71935}.reading-report .severity-alta{background:#df701b}.reading-report .severity-media{background:#e4b622}.reading-report .severity-baja{background:#2782b8}
.reading-report .severity-legend{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:11px;color:var(--muted)}.reading-report .severity-legend span:not(.severity-dot){margin-right:12px}
.reading-report .risk-overview{list-style:none;padding:0}.reading-report .risk-overview li{display:flex;align-items:baseline;gap:10px;margin:12px 0}.reading-report .risk-certainty{font-size:12px;color:var(--muted)}
.reading-report .reading-strengths{border-left:4px solid #007f83}.reading-report .reading-strengths li{margin:16px 0;line-height:1.8}.reading-report .reading-good{background:#edf7f6;border-left:3px solid #007f83;padding:14px 18px;line-height:1.8;margin:16px 0}
@media(max-width:700px){.reading-report .wrap{padding-left:20px;padding-right:20px}.reading-report .reading-panel,.reading-report .reading-risk{padding:20px}.reading-report .nav .wrap{gap:12px}.reading-report .nav a{font-size:11px}.reading-report .hero h1{font-size:34px}}

.hero-art{position:absolute;inset:0 0 0 52%;z-index:-1;background:linear-gradient(105deg,#082438 12%,#10516a 100%)}
.chapter > details{margin:14px 0}
.reading-risk{background:#fff;border:1px solid var(--line)}
.reading-risk h4,.reading-answer h4{overflow-wrap:anywhere}
.reading-report .source{color:var(--muted)}

  </style>

  <script id="arktic-report-navigation">
// Trusted navigation only; repository and model text is always escaped by the renderer.
(() => {
  function reveal(id) {
    let target;
    try { target = document.getElementById(decodeURIComponent(id)); } catch { return; }
    if (!target) return;
    for (let node = target; node; node = node.parentElement) {
      if (node.tagName === 'DETAILS') node.open = true;
    }
    requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
  }
  document.addEventListener('click', event => {
    const anchor = event.target.closest && event.target.closest('a[href^="#"]');
    if (anchor) reveal(anchor.getAttribute('href').slice(1));
  });
  window.addEventListener('hashchange', () => reveal(location.hash.slice(1)));
  if (location.hash) reveal(location.hash.slice(1));
  let closedForPrint = [];
  window.addEventListener('beforeprint', () => {
    closedForPrint = [...document.querySelectorAll('details:not([open])')];
    for (const node of closedForPrint) node.open = true;
  });
  window.addEventListener('afterprint', () => {
    for (const node of closedForPrint) node.open = false;
    closedForPrint = [];
  });
})();
</script>
